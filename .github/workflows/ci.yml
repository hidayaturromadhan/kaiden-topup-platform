name: KAIDEN CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-verify:
    name: Build, Audit & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite, pdo_sqlite, bcmath, curl
          coverage: none

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Prepare Environment & Directories
        run: |
          cp .env.example .env
          mkdir -p database storage/framework/{sessions,views,cache} bootstrap/cache
          touch database/database.sqlite
          chmod -R 777 storage bootstrap/cache

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Install NPM Dependencies & Build Frontend Assets
        run: |
          npm ci
          npm run build

      - name: Run Automated Test Suite (39 Tests)
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          MIDTRANS_SERVER_KEY: dummy-midtrans-server-key
          MIDTRANS_CLIENT_KEY: dummy-midtrans-client-key
          DIGIFLAZZ_API_KEY: dev-digiflazz-key
          DIGIFLAZZ_USERNAME: kaiden_dev
        run: php artisan test --verbose
